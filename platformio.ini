; CrowPanel 7" V3.0 (ESP32-S3-WROOM-1-N4R8: 4 MB flash, 8 MB octal PSRAM) — bkz. docs/DONANIM.md
[env:crowpanel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_opi
; min_spiffs: iki 1.875 MB uygulama bolumu (OTA icin sart) + 128 KB LittleFS (ev-lamba ile ayni)
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/gen_html.py
build_flags =
    -DBOARD_HAS_PSRAM
    ; GELISTIRME: /screen.bmp ekran goruntusu. Teslim imajinda bu satir SILINIR.
    -DDEV_SCREENSHOT
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Seri CH340/UART0 uzerinden; native USB (IO19/IO20) I2C icin ayrili
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    lvgl/lvgl@~9.2.2
    bblanchon/ArduinoJson @ 7.4.2
    knolleary/PubSubClient @ ^2.8
    https://github.com/ESP32Async/AsyncTCP.git @ ^3.3.2
    https://github.com/ESP32Async/ESPAsyncWebServer.git @ ^3.7.7
