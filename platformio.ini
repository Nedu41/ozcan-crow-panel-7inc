; CrowPanel 7" V3.0 (ESP32-S3-WROOM-1-N4R8: 4 MB flash, 8 MB octal PSRAM) — bkz. docs/DONANIM.md
[env:crowpanel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    ; Seri CH340/UART0 uzerinden; native USB (IO19/IO20) I2C icin ayrili
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; LovyanGFX Bus_RGB icin esp_lcd baslik yolu (core 2.0.x derlemesinde varsayilan degil)
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/sdk/esp32s3/include/esp_lcd/include
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
