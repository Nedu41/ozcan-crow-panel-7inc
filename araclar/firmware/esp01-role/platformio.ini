; HUB'a eklenecek role dugumu (2 roleli) firmware'i. ev-lamba projesinden alindi (kaynak: D:\Kodlar\ev-lamba\ESP01_AI_Rolekontrol_AI_Mac_ID_v2_0_3).
; Calistirma: pio run -e esp01_1m -t upload --upload-port COMx   (USB-seri programlayici, GPIO0 -> GND ile flas modu)

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
; Proje SPIFFS/LittleFS kullanmiyor: FS'siz 1MB yerlesim (OTA icin daha cok serbest alan)
board_build.ldscript = eagle.flash.1m.ld
; DOUT: her flas cipinde calisan guvenli mod
board_build.flash_mode = dout
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ 7.4.2
    knolleary/PubSubClient @ ^2.8
    arduino-libraries/NTPClient @ ^3.2.1

; ESP-07 devresi: roleler GPIO4/GPIO5
[env:esp07_gpio45]
extends = env:esp01_1m
build_flags = -DBOARD_ESP07

; ESP32-C3 SuperMini (USB'den dogrudan yuklenir). Roleler GPIO3 / GPIO4.
[env:c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${env:esp01_1m.lib_deps}
