; HUB'a eklenecek role dugumu (2 roleli) firmware'i. ev-lamba projesinden alindi (kaynak: ev-lamba/ESP01_AI_Rolekontrol_AI_Mac_ID_v2_0_3).
; Calistirma: pio run -e <kart> -t upload --upload-port COMx
; Hazir imajlar: bin/<kart>.bin (README'ye bak). Kart secimi = ortam adi; pinler/polarite derleme bayraklariyla.
; Role modulu LOW ile calisiyorsa (cogu 2 kanalli optokuplorlu modul): build_flags'e -DRELAY_ACTIVE_LOW ekle.

[platformio]
src_dir = src/ESP01_AI_Rolekontrol_AI_Mac_ID_v2_0_3

; ---------------- ESP8266 ----------------
[env:esp01_1m]
extra_scripts = pre:gizlilik.py
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
; Proje SPIFFS/LittleFS kullanmiyor: FS'siz 1MB yerlesim (OTA icin daha cok serbest alan)
board_build.ldscript = eagle.flash.1m.ld
; DOUT: her flas cipinde calisan guvenli mod
board_build.flash_mode = dout
build_flags = -I$PROJECT_DIR/src
lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ 7.4.2
    knolleary/PubSubClient @ ^2.8
    arduino-libraries/NTPClient @ ^3.2.1

; ESP-07 devresi: roleler GPIO4/GPIO5
[env:esp07_gpio45]
extends = env:esp01_1m
build_flags = -I$PROJECT_DIR/src -DBOARD_ESP07

; NodeMCU / ESP-12E / ESP-12F (4MB): roleler D1=GPIO5, D2=GPIO4
[env:nodemcu]
extends = env:esp01_1m
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld
build_flags = -I$PROJECT_DIR/src -DBOARD_NODEMCU

; Wemos / LOLIN D1 mini (4MB): NodeMCU ile ayni pinler
[env:d1_mini]
extends = env:esp01_1m
board = d1_mini
board_build.ldscript = eagle.flash.4m1m.ld
build_flags = -I$PROJECT_DIR/src -DBOARD_NODEMCU

; Sonoff Basic (ESP8285, 1MB): role GPIO12 (tek role)
[env:sonoff_basic]
extends = env:esp01_1m
board = esp8285
build_flags = -I$PROJECT_DIR/src -DBOARD_SONOFF

; ---------------- ESP32 ----------------
; ESP32-C3 SuperMini (USB'den dogrudan yuklenir). Roleler GPIO3 / GPIO4.
[env:c3_supermini]
extra_scripts = pre:gizlilik.py
platform = espressif32@7.0.1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = -I$PROJECT_DIR/src -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = ${env:esp01_1m.lib_deps}

; ESP32 DevKit (WROOM-32): roleler GPIO26 / GPIO27
[env:esp32_devkit]
extra_scripts = pre:gizlilik.py
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I$PROJECT_DIR/src -DBOARD_ESP32DEV
lib_deps = ${env:esp01_1m.lib_deps}

; ESP32-S3 DevKitC-1: roleler GPIO4 / GPIO5
[env:esp32_s3]
extra_scripts = pre:gizlilik.py
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -I$PROJECT_DIR/src -DBOARD_ESP32S3
lib_deps = ${env:esp01_1m.lib_deps}
